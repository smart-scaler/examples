<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLM Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f7f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 22px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .user {
      font-weight: 600;
    }

    .assistant {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      padding: 0 18px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      background: #000;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Avesha EGS Hosted LLM On Akamai LKE </h1>

    <div id="chat" class="chat"></div>

    <div class="input-area">
      <textarea
        id="prompt"
        rows="3"
        placeholder="Ask a question..."
      ></textarea>
      <button id="sendBtn" onclick="sendPrompt()">Send</button>
    </div>
  </div>

  <script>
    const API_URL = "http://172.237.156.239:31972/v1/completions";
    const MODEL = "nvidia/Llama-3.1-8B-Instruct-FP8";

    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "message";

      if (role === "user") {
        div.innerHTML = `<div class="user">You</div>${text}`;
      } else {
        div.innerHTML = `<div class="user">Assistant</div><div class="assistant">${text}</div>`;
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendPrompt() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      promptInput.value = "";
      sendBtn.disabled = true;

      addMessage("user", prompt);
      addMessage("assistant", "Thinking...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL,
            prompt: prompt,
            max_tokens: 100
          })
        });

        const data = await response.json();

        // Remove "Thinking..."
        chat.lastChild.remove();

        const text =
          data?.choices?.[0]?.text ||
          data?.choices?.[0]?.message?.content ||
          JSON.stringify(data, null, 2);

        addMessage("assistant", text);
      } catch (err) {
        chat.lastChild.remove();
        addMessage("assistant", "Error calling LLM service.");
        console.error(err);
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
